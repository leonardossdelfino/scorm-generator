<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCORM GENERATOR</title>
<meta name="description" content="Gerador de pacotes SCORM 2004 e 1.2 a partir de PDF, imagens, video e quiz. Roda inteiro no navegador.">


<link rel="stylesheet" href="css/nunito.css">
<link rel="stylesheet" href="css/bancada.css">
</head>
<body>
<!-- Barra superior: titulo do curso e acoes de projeto/exportacao -->
<div class="app">
  <header class="topbar">
    <div class="brand">SCORM GENERATOR<small id="verBadge">V1</small></div>
    <div class="sep"></div>
    <input class="title-input" id="courseTitle" placeholder="Nome do curso" value="Novo curso">
    <div class="spacer"></div>
    <span class="pill" id="statPill">0 páginas</span>
    <!-- Ajuda: abre em outra aba de proposito. -->
    <a class="btn btn-dark btn-sm" href="como-usar.html" target="_blank" rel="noopener">Instruções de uso</a>
    <button class="btn btn-dark btn-sm" id="btnProjNew">Criar novo</button>
    <button class="btn btn-dark btn-sm" id="btnProjSave">Salvar projeto</button>
    <button class="btn btn-dark btn-sm" id="btnProjOpen">Abrir</button>
    <button class="btn btn-primary" id="btnExport">Exportar SCORM</button>
  </header>

  <!-- Tres paineis. A largura fixa das colunas esta em .panes (CSS);
       abaixo de 1000px eles empilham. -->
  <div class="panes">
    <!-- TRILHA: ordem das paginas, botao Visao geral e importacoes -->
    <section class="pane pane-track">
      <button class="ovbtn" id="btnOverview" type="button">
        <span class="ovbtn-ic" aria-hidden="true"></span>
        <span>Visão geral</span>
      </button>
      <div class="pane-head">Trilha <span class="count" id="trackCount"></span></div>
      <div class="pane-body"><div class="track-list" id="trackList"></div></div>
      <div class="track-add">
        <button class="btn btn-sm" id="btnAddPdf">Importar PDF…</button>
        <button class="btn btn-sm" id="btnAddImg">Importar imagens…</button>
        <button class="btn btn-sm" id="btnAddVideo">+ Página de vídeo</button>
        <button class="btn btn-sm" id="btnAddQuiz">+ Quiz</button>
      </div>
    </section>

    <!-- PALCO: previa da pagina selecionada + navegacao anterior/proxima -->
    <section class="pane pane-stage">
      <div class="stage-wrap" id="stageWrap"><div id="stage"></div></div>
      <div class="stage-bar">
        <button class="btn btn-ghost btn-sm" id="btnPrev">‹ Anterior</button>
        <span class="pos" id="stagePos">—</span>
        <button class="btn btn-ghost btn-sm" id="btnNext">Próxima ›</button>
      </div>
    </section>

    <!-- INSPETOR: edicao da pagina selecionada ou das opcoes do curso -->
    <section class="pane pane-insp">
      <div class="pane-head"><span id="inspTitle">Curso</span></div>
      <div class="pane-body"><div class="insp" id="insp"></div></div>
    </section>
  </div>
</div>

<!-- Painel de exportacao: checklist de validate() e botao de gerar o zip -->
<div class="drawer" id="drawer">
  <div class="sheet">
    <div class="sheet-h" id="drawerTitle">Exportar pacote SCORM</div>
    <div class="sheet-b" id="drawerBody"></div>
    <div class="sheet-f">
      <button class="btn" id="drawerCancel">Fechar</button>
      <button class="btn btn-primary" id="drawerGo">Gerar .zip</button>
    </div>
  </div>
</div>

<!-- Inputs de arquivo escondidos, acionados por click() nos botoes.
     Sao ligados a suas funcoes em init(), pela funcao hook(). -->
<input type="file" id="filePdf" accept="application/pdf" class="hidden">
<input type="file" id="fileImg" accept="image/*" multiple class="hidden">
<input type="file" id="fileProj" accept=".json,application/json" class="hidden">
<input type="file" id="fileLogo" accept="image/*" class="hidden">
<input type="file" id="fileZip" accept=".zip" class="hidden">
<input type="file" id="fileVideo" accept="video/mp4,video/webm" class="hidden">

<script type="text/plain" id="tpl-index"><!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="head">
    <img id="logo" class="hide" alt="">
    <h1 id="ctitle">@@TITLE@@</h1>
    <span class="sp"></span>
    <span class="sub" id="subtitle"></span>
    <span class="offline hide" id="offline">fora do LMS &middot; sem registro</span>
  </header>
  <div class="progwrap" id="progwrap"><i id="prog"></i></div>
  <main class="scroller" id="scroller">
    <div class="stage" id="stage"></div>
  </main>
  <footer class="foot">
    <button class="btn" id="prev">Voltar</button>
    <span class="pos" id="pos">—</span>
    <button class="btn primary" id="next">Avançar</button>
  </footer>
</div>
@@SCRIPTS@@
</body>
</html>
</script>
<script type="text/plain" id="tpl-css">/* Estilos do curso exportado. A cor da marca escolhida na ferramenta e
   injetada em --brand pelo boot() do player.js. */
:root{
  --brand:#1b2733;
  --ink:#16202b; --muted:#6a7887; --line:#dfe4ea; --line2:#f0f3f6;
  --bg:#eceff3; --card:#ffffff;
  --ok:#0f7b4f; --ok-bg:#e6f4ed; --bad:#a81e14; --bad-bg:#fbeae8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.hide{display:none!important}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.shell{display:flex;flex-direction:column;height:100vh;min-height:0}

/* topo */
.head{
  flex:0 0 auto;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;
}
.head img{max-height:26px;width:auto;display:block}
.head h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.head .sp{flex:1 1 auto}
.head .sub{font-size:12.5px;opacity:.72;max-width:34ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.offline{
  font-size:11px;background:rgba(255,255,255,.16);padding:3px 7px;border-radius:4px;
}

/* progresso */
.progwrap{flex:0 0 auto;height:3px;background:rgba(0,0,0,.09)}
.progwrap i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}

/* palco */
/* margin:auto no lugar de align-items:center — margem automatica vira zero
   quando falta espaco, mantendo o topo do conteudo alto alcancavel pelo scroll. */
.scroller{flex:1 1 auto;overflow:auto;min-height:0;padding:18px;display:flex}
.stage{
  width:100%;max-width:1280px;margin:auto;background:var(--card);border-radius:6px;
  box-shadow:0 1px 2px rgba(22,32,43,.07),0 10px 28px -14px rgba(22,32,43,.22);
  overflow:hidden;
}
/* --media-h é a altura livre entre cabecalho e rodape. Limitar a midia por
   ela faz o slide crescer com a janela em vez de ficar preso a 960px. */
:root{--media-h:calc(100vh - 150px)}
@supports (height:100dvh){ :root{--media-h:calc(100dvh - 150px)} }
img.slide{
  display:block;width:100%;height:auto;
  max-height:var(--media-h);object-fit:contain;background:var(--card);
}
.videowrap{background:#000}
iframe.video,video.video{
  display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;
  max-height:var(--media-h);object-fit:contain;
}
.vnote{padding:14px 30px 18px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line2)}
.pad{padding:26px 30px 32px}
.done{text-align:center;padding:56px 30px}
.done h2{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
.done p{margin:0 0 6px}

/* botoes */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:7px 13px;border-radius:5px;cursor:pointer;font:inherit;
}
/* O :not(.primary) e essencial: sem ele este hover pintava o botao primario
   de cinza claro mantendo o texto branco, deixando o rotulo ilegivel. */
.btn:not(.primary):hover:not(:disabled){background:var(--line2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:550}
.btn.primary:hover:not(:disabled){background:var(--brand);filter:brightness(1.45)}
.btn.big{padding:10px 20px;font-size:15px;margin-top:18px}

/* barra inferior */
.foot{
  flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;
}
.foot .pos{font-size:13px;color:var(--muted);min-width:76px;text-align:center;
  font-variant-numeric:tabular-nums}

/* quiz */
.quiz h2{font-size:19px;margin:0 0 3px;letter-spacing:-.01em}
.quiz h3{font-size:15px;margin:26px 0 10px}
.quiz .intro{
  background:var(--line2);padding:12px 14px;border-radius:5px;margin:16px 0 4px;font-size:14px;
}
fieldset.q{border:0;border-top:1px solid var(--line2);margin:0;padding:16px 0 8px}
fieldset.q legend{
  font-weight:600;padding:0;margin-bottom:8px;display:block;width:100%;
}
.qn{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
label.ch{
  display:flex;gap:10px;align-items:flex-start;padding:7px 9px;
  border:1px solid transparent;border-radius:5px;cursor:pointer;
}
label.ch:hover{background:var(--line2)}
label.ch input{margin:5px 0 0;flex:0 0 auto}
label.ch:has(input:checked){background:var(--line2);border-color:var(--line)}
.warn{color:var(--bad);font-size:14px;margin:14px 0 0}

/* resultado */
.result{text-align:center;padding:26px 20px;border-radius:6px;margin-bottom:6px}
.result.pass{background:var(--ok-bg)}
.result.fail{background:var(--bad-bg)}
.big-num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.result.pass .big-num,.result.pass .verdict{color:var(--ok)}
.result.fail .big-num,.result.fail .verdict{color:var(--bad)}
.verdict{font-size:16px;font-weight:600;margin:6px 0 4px}
.result p{margin:0}

.rev{border-top:1px solid var(--line2);padding:14px 0}
.revq{font-weight:600;margin:0 0 8px}
.revc{margin:0;padding:4px 0 4px 26px;position:relative;color:var(--muted);font-size:14px}
.revc .mk{position:absolute;left:4px;font-weight:700}
.revc.sel-good{color:var(--ok);font-weight:550}
.revc.sel-bad{color:var(--bad);font-weight:550}
.revc.is-right{color:var(--ok)}
.fb{
  margin:9px 0 0;padding:9px 12px;background:var(--line2);
  border-radius:5px;font-size:13.5px;
}

@media (max-width:640px){
  .scroller{padding:0}
  .stage{border-radius:0;box-shadow:none}
  .pad{padding:20px 18px 26px}
  .head .sub{display:none}
  .big-num{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</script>
<script type="text/plain" id="tpl-player">/* =============================================================================
   PLAYER DO CURSO — vai dentro do pacote SCORM
   =============================================================================

   Le todo o conteudo de window.COURSE, definido em course-data.js.
   Nao faz fetch de nada: o conteudo e injetado como variavel global, o que
   evita problemas de CORS e permite abrir o index.html direto do disco.

   ESTADO (objeto st)
     i          indice da pagina atual
     viewed     {idDaPagina: 1} paginas ja concluidas
     watch      {idDaPagina: segundos} maior ponto assistido de cada video
     quiz       resultado do quiz: {score, hit, total, passed, answers}
     order      ordem sorteada das questoes, quando randomize esta ligado
     submitted  se o quiz ja foi enviado

   PERSISTENCIA
     Tudo isso e serializado em cmi.suspend_data por save() e recuperado por
     restore(), entao o aluno volta de onde parou. O campo v: 2 no JSON e a
     versao do formato — restore() aceita v1 (pacotes antigos, sem watch).

   TRAVAS DE NAVEGACAO
     canLeave() e o unico lugar que decide se o botao Avancar libera:
       - video com requireWatch: precisa ter atingido 95%
       - quiz: precisa ter sido enviado, e aprovado se blockWhenFailed
       - settings.freeNav ligado no curso desliga as duas travas
     Vale lembrar que isso e JavaScript no navegador: serve para organizar o
     percurso, nao como controle de seguranca.

   O QUE VAI PARA O LMS
     pushStatus() concentra as escritas: progresso, nota e conclusao.
     A conclusao exige todas as paginas vistas e, se requireQuizPass estiver
     ligado, tambem aprovacao no quiz.
   ========================================================================== */
(function () {
  "use strict";

  var C = window.COURSE;
  if (!C) { document.body.innerHTML = "<p style='padding:24px'>course-data.js não carregou.</p>"; return; }

  var pages = C.pages || [];
  var cfg = C.settings || {};
  var quizPage = null;
  for (var qi = 0; qi < pages.length; qi++) if (pages[qi].type === "quiz") { quizPage = pages[qi]; break; }

  var st = {
    i: 0,
    viewed: {},
    watch: {},           // {pageId: segundo maximo assistido}
    quiz: null,          // {score, passed, answers:{qid:choiceId}}
    order: null,         // ordem sorteada das questoes
    submitted: false
  };

  /* ---------------- persistencia ---------------- */
  function save() {
    if (!SCORM.active) return;
    SCORM.setBookmark(String(st.i));
    try {
      var w = {};
      for (var k in st.watch) w[k] = Math.round(st.watch[k]);
      SCORM.setSuspend(JSON.stringify({
        v: 2, i: st.i, viewed: Object.keys(st.viewed), watch: w, quiz: st.quiz
      }));
    } catch (e) {}
    pushStatus();
    SCORM.commit();
  }

  // Recupera posicao, paginas vistas, progresso de video e resultado do quiz.
  function restore() {
    if (!SCORM.active) return;
    var s = SCORM.getSuspend();
    if (!s) return;
    try {
      var d = JSON.parse(s);
      if (!d || (d.v !== 1 && d.v !== 2)) return;
      (d.viewed || []).forEach(function (k) { st.viewed[k] = 1; });
      if (d.watch) for (var k in d.watch) st.watch[k] = Number(d.watch[k]) || 0;
      st.quiz = d.quiz || null;
      if (st.quiz) st.submitted = true;
      var i = parseInt(d.i, 10);
      if (!isNaN(i) && i >= 0 && i < pages.length) st.i = i;
    } catch (e) {}
  }

  // Devolve true se todas as paginas do curso foram vistas.
  function allViewed() {
    for (var k = 0; k < pages.length; k++) if (!st.viewed[pages[k].id]) return false;
    return true;
  }

  // Envia progresso, nota e status de conclusao para o LMS.
  function pushStatus() {
    if (!SCORM.active) return;
    var seen = 0;
    for (var k = 0; k < pages.length; k++) if (st.viewed[pages[k].id]) seen++;
    SCORM.setProgress(pages.length ? seen / pages.length : 1);

    if (st.quiz) SCORM.setScore(st.quiz.score, st.quiz.passed);

    var done = allViewed();
    if (cfg.requireQuizPass && quizPage) done = done && !!(st.quiz && st.quiz.passed);
    SCORM.setComplete(done);
  }

  /* ---------------- navegacao ---------------- */
  function canLeave(idx) {
    var p = pages[idx];
    if (!p) return true;
    if (cfg.freeNav) return true;
    if (p.type === "video" && p.requireWatch && !st.viewed[p.id]) return false;
    if (p.type !== "quiz") return true;
    if (!st.submitted || !st.quiz) return false;
    if (quizPage.config.blockWhenFailed && !st.quiz.passed) return false;
    return true;
  }

  // Navega para a pagina de indice n, respeitando canLeave().
  function go(n) {
    if (n > st.i && !canLeave(st.i)) return;
    if (n < 0 || n >= pages.length) return;
    st.i = n;
    render();
    save();
    document.getElementById("scroller").scrollTop = 0;
  }

  /* ---------------- quiz ---------------- */
  function questionOrder() {
    var qs = quizPage.questions.slice();
    if (quizPage.config.randomize) {
      if (!st.order) {
        var idx = qs.map(function (_, k) { return k; });
        for (var a = idx.length - 1; a > 0; a--) {
          var b = Math.floor(Math.random() * (a + 1));
          var t = idx[a]; idx[a] = idx[b]; idx[b] = t;
        }
        st.order = idx;
      }
      return st.order.map(function (k) { return qs[k]; });
    }
    return qs;
  }

  // Corrige as respostas e devolve acertos, percentual e aprovacao.
  function grade(answers) {
    var qs = quizPage.questions, hit = 0;
    qs.forEach(function (q) {
      var pick = answers[q.id];
      var right = null;
      q.choices.forEach(function (c) { if (c.correct) right = c.id; });
      if (pick && pick === right) hit++;
    });
    var pct = qs.length ? Math.round((hit / qs.length) * 100) : 0;
    return { score: pct, hit: hit, total: qs.length, passed: pct >= Number(quizPage.config.passingScore), answers: answers };
  }

  // Coleta as respostas marcadas, cobra as que faltam e corrige o quiz.
  function submitQuiz() {
    var answers = {};
    var missing = 0;
    quizPage.questions.forEach(function (q) {
      var el = document.querySelector('input[name="q_' + q.id + '"]:checked');
      if (el) answers[q.id] = el.value; else missing++;
    });
    if (missing) {
      var w = document.getElementById("quizWarn");
      w.textContent = missing === 1
        ? "Falta responder 1 questão."
        : "Faltam responder " + missing + " questões.";
      w.classList.remove("hide");
      return;
    }
    st.quiz = grade(answers);
    st.submitted = true;
    st.viewed[quizPage.id] = 1;
    render();
    save();
    document.getElementById("scroller").scrollTop = 0;
  }

  // Limpa o resultado para o aluno tentar de novo.
  function retryQuiz() {
    st.quiz = null;
    st.submitted = false;
    st.order = null;
    render();
    save();
  }

  /* ---------------- render ---------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  // Escapa HTML e converte quebras de linha em <br>.
  function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }

  // HTML de uma pagina de slide.
  function renderSlide(p) {
    return '<img class="slide" src="' + esc(p.file) + '" alt="' + esc(p.title || "Slide") + '">';
  }

  // HTML da pagina de video: <video> para MP4 local, <iframe> para link.
  function renderVideo(p) {
    if (p.src) {
      return '<div class="videowrap"><video id="vid" class="video" src="' + esc(p.src) +
        '" controls playsinline preload="metadata" controlslist="nodownload"' +
        ' disablepictureinpicture oncontextmenu="return false"></video></div>' +
        (p.requireWatch ? '<div class="pad vnote" id="vnote"></div>' : "");
    }
    if (p.embed) {
      return '<div class="videowrap"><iframe class="video" src="' + esc(p.embed) +
        '" title="' + esc(p.title || "Vídeo") +
        '" referrerpolicy="strict-origin-when-cross-origin"' +
        ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';
    }
    return '<div class="pad"><p class="muted">Nenhum vídeo configurado nesta página.</p></div>';
  }

  /* travas de exibicao do video em arquivo */
  function wireVideo(p) {
    var v = document.getElementById("vid");
    if (!v) return;
    var key = p.id;
    if (!st.watch) st.watch = {};
    var seen = st.watch[key] || 0;      // maior segundo already assistido
    var note = document.getElementById("vnote");

    // Atualiza o aviso de quanto falta de video para liberar o avanco.
    function tell() {
      if (!note) return;
      if (st.viewed[key]) { note.textContent = "Vídeo concluído. Você pode avançar."; return; }
      var d = v.duration;
      if (!d || !isFinite(d)) { note.textContent = "Assista ao vídeo para liberar o avanço."; return; }
      var left = Math.max(0, Math.ceil((d * 0.95 - seen)));
      note.textContent = "Faltam cerca de " + left + "s de vídeo para liberar o avanço.";
    }

    v.addEventListener("loadedmetadata", function () {
      if (seen > 1 && seen < v.duration - 1) { try { v.currentTime = seen; } catch (e) {} }
      tell();
    });

    v.addEventListener("timeupdate", function () {
      var t = v.currentTime;
      // Credita SOMENTE avanco continuo. Um salto na barra (ou um seek
      // programatico) produz um delta grande e nao conta como assistido —
      // sem isso, arrastar para o fim liberaria o curso na hora.
      if (t > seen && t - seen <= 2) seen = t;
      st.watch[key] = seen;
      var d = v.duration;
      if (p.requireWatch && d && isFinite(d) && seen >= d * 0.95 && !st.viewed[key]) {
        st.viewed[key] = 1;
        save();
        syncFooter();   // nao chamar render(): recriaria o <video> e pararia a reproducao
      }
      tell();
    });

    // Exigir assistir ate o fim implica nao poder pular: sem o clamp o aluno
    // travaria para sempre, porque o trecho saltado nunca seria creditado.
    if (p.noSeek || p.requireWatch) {
      var clamp = function () {
        if (st.viewed[key]) return;              // liberado depois de concluir
        if (v.currentTime > seen + 1.5) {
          try { v.currentTime = seen; } catch (e) {}
        }
      };
      v.addEventListener("seeking", clamp);
      v.addEventListener("seeked", clamp);
    }

    v.addEventListener("ended", function () {
      st.viewed[key] = 1;
      save();
      render();
    });
  }

  // HTML do quiz antes de responder.
  function renderQuizForm(p) {
    var h = '<div class="pad quiz">';
    h += '<h2>' + esc(p.title || "Avaliação") + "</h2>";
    // Mesma regra da Bancada: subtitulo preenchido manda, senao monta o automatico.
    var n = p.questions.length;
    var sub = (p.config.subtitle || "").trim() ||
      (n + (n === 1 ? " questão" : " questões") +
       " · nota mínima " + p.config.passingScore + "%" +
       " · " + (p.config.allowRetry ? "nova tentativa liberada" : "tentativa única"));
    h += '<p class="muted">' + esc(sub) + "</p>";
    if (p.config.intro) h += '<div class="intro">' + nl2br(p.config.intro) + "</div>";

    questionOrder().forEach(function (q, k) {
      h += '<fieldset class="q"><legend><span class="qn">' + (k + 1) + ".</span> " + nl2br(q.text) + "</legend>";
      q.choices.forEach(function (c) {
        var id = "c_" + q.id + "_" + c.id;
        h += '<label class="ch" for="' + id + '">' +
          '<input type="radio" id="' + id + '" name="q_' + q.id + '" value="' + esc(c.id) + '">' +
          "<span>" + nl2br(c.text) + "</span></label>";
      });
      h += "</fieldset>";
    });

    h += '<p id="quizWarn" class="warn hide"></p>';
    h += '<button class="btn primary big" id="btnSubmitQuiz">Enviar respostas</button>';
    h += "</div>";
    return h;
  }

  // HTML da tela de resultado, com revisao das respostas se configurado.
  function renderQuizResult(p) {
    var r = st.quiz;
    var h = '<div class="pad quiz">';
    h += '<div class="result ' + (r.passed ? "pass" : "fail") + '">';
    h += "<div class=\"big-num\">" + r.score + "%</div>";
    h += "<p class=\"verdict\">" + (r.passed ? "Aprovado" : "Não aprovado") + "</p>";
    h += '<p class="muted">' + r.hit + " de " + r.total + " corretas &middot; nota mínima " + esc(p.config.passingScore) + "%</p>";
    h += "</div>";

    if (p.config.showAnswers) {
      h += "<h3>Suas respostas</h3>";
      p.questions.forEach(function (q, k) {
        var pick = r.answers[q.id], right = null;
        q.choices.forEach(function (c) { if (c.correct) right = c.id; });
        var good = pick === right;
        h += '<div class="rev ' + (good ? "good" : "bad") + '">';
        h += '<p class="revq"><span class="qn">' + (k + 1) + ".</span> " + nl2br(q.text) + "</p>";
        q.choices.forEach(function (c) {
          var mark = "", cls = "";
          if (c.id === pick) { cls = good ? "sel-good" : "sel-bad"; mark = good ? "\u2713" : "\u2717"; }
          if (p.config.showCorrect && c.correct && c.id !== pick) { cls = "is-right"; mark = "\u2713"; }
          h += '<p class="revc ' + cls + '"><span class="mk">' + mark + "</span>" + nl2br(c.text) + "</p>";
        });
        var fb = good ? q.feedbackOk : q.feedbackNo;
        if (fb) h += '<p class="fb">' + nl2br(fb) + "</p>";
        h += "</div>";
      });
    }

    if (!r.passed && p.config.allowRetry) {
      h += '<button class="btn primary big" id="btnRetryQuiz">Tentar novamente</button>';
    }
    if (!r.passed && !p.config.allowRetry) {
      h += '<p class="warn">Nova tentativa não permitida neste curso.</p>';
    }
    if (!r.passed && p.config.blockWhenFailed) {
      h += '<p class="muted">É necessário ser aprovado para avançar.</p>';
    }
    h += "</div>";
    return h;
  }

  // Desenha a pagina atual e atualiza o rodape (posicao, botoes, progresso).
  // Diz se a pagina cumpriu o que dependia do aluno (responder / assistir).
  // Diferente de canLeave(): aqui reprovar no quiz ainda conta como cumprido,
  // porque na ultima pagina nao faz sentido impedir o aluno de encerrar.
  function pageAnswered(idx) {
    var p = pages[idx];
    if (!p) return true;
    if (p.type === "quiz") return !!st.submitted;
    if (p.type === "video" && p.requireWatch) return !!st.viewed[p.id];
    return true;
  }

  // Atualiza posicao, botoes e barra de progresso sem redesenhar o palco.
  function syncFooter() {
    var last = st.i >= pages.length - 1;
    document.getElementById("pos").textContent = (st.i + 1) + " / " + pages.length;

    var prev = document.getElementById("prev");
    var next = document.getElementById("next");
    prev.disabled = st.i === 0;
    next.textContent = last ? "Concluir" : "Avançar";
    next.disabled = last ? !pageAnswered(st.i) : !canLeave(st.i);

    if (cfg.showProgress) {
      var vistas = 0;
      for (var k = 0; k < pages.length; k++) if (st.viewed[pages[k].id]) vistas++;
      document.getElementById("prog").style.width =
        Math.round((vistas / pages.length) * 100) + "%";
    }
  }

  // Encerra a sessao: envia o resultado final, fecha a comunicacao com o LMS
  // e troca o palco por uma confirmacao. Chamada pelo botao Concluir.
  function finishCourse() {
    pushStatus();
    var registrou = SCORM.active;
    SCORM.commit();
    SCORM.finish("normal");   // encerramento deliberado, nao suspensao

    var msg = "";
    if (st.quiz) {
      msg += "Sua nota: " + st.quiz.score + "% — " +
             (st.quiz.passed ? "aprovado" : "não aprovado") + ". ";
    }
    msg += registrou
      ? "O resultado foi registrado na plataforma de treinamento."
      : "Este curso foi aberto fora da plataforma, então nada foi registrado.";

    document.getElementById("stage").innerHTML =
      '<div class="pad done"><h2>Curso concluído</h2><p>' + esc(msg) + "</p>" +
      '<p class="muted">Você pode fechar esta janela.</p></div>';

    var foot = document.querySelector(".foot");
    if (foot) foot.style.display = "none";
    document.getElementById("scroller").scrollTop = 0;

    // Só funciona se a janela foi aberta por script (popup do LMS). Se o
    // navegador bloquear, a mensagem acima ja orienta o aluno.
    try { window.close(); } catch (e) {}
  }

  // Desenha a pagina atual e atualiza o rodape (posicao, botoes, progresso).
  function render() {
    var p = pages[st.i];
    if (!p) return;
    var gated = (p.type === "quiz") || (p.type === "video" && p.requireWatch);
    if (!gated) st.viewed[p.id] = 1;

    var body = "";
    if (p.type === "slide") body = renderSlide(p);
    else if (p.type === "video") body = renderVideo(p);
    else if (p.type === "quiz") body = st.submitted && st.quiz ? renderQuizResult(p) : renderQuizForm(p);

    document.getElementById("stage").innerHTML = body;
    if (p.type === "video") wireVideo(p);

    // barra inferior
    syncFooter();

    var sub = document.getElementById("subtitle");
    if (sub) sub.textContent = p.title || "";

    var b1 = document.getElementById("btnSubmitQuiz");
    if (b1) b1.addEventListener("click", submitQuiz);
    var b2 = document.getElementById("btnRetryQuiz");
    if (b2) b2.addEventListener("click", retryQuiz);
  }

  /* ---------------- boot ---------------- */
  function boot() {
    document.title = C.title || "Curso";
    var ttl = document.getElementById("ctitle");
    if (ttl) ttl.textContent = C.title || "Curso";

    if (C.primary) document.documentElement.style.setProperty("--brand", C.primary);
    var lg = document.getElementById("logo");
    if (C.logo && lg) { lg.src = C.logo; lg.classList.remove("hide"); }
    if (!cfg.showProgress) {
      var pb = document.getElementById("progwrap");
      if (pb) pb.classList.add("hide");
    }

    SCORM.init();
    if (!SCORM.active) {
      var badge = document.getElementById("offline");
      if (badge) badge.classList.remove("hide");
    }
    restore();
    render();
    pushStatus();
    SCORM.commit();

    document.getElementById("prev").addEventListener("click", function () { go(st.i - 1); });
    document.getElementById("next").addEventListener("click", function () {
      if (st.i >= pages.length - 1) finishCourse();   // ultima pagina: encerra
      else go(st.i + 1);
    });

    document.addEventListener("keydown", function (e) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") go(st.i + 1);
      if (e.key === "ArrowLeft" || e.key === "PageUp") go(st.i - 1);
    });

    window.addEventListener("beforeunload", function () { pushStatus(); SCORM.finish(); });
    window.addEventListener("pagehide", function () { pushStatus(); SCORM.finish(); });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script type="text/plain" id="tpl-scorm">/* =============================================================================
   WRAPPER DA API SCORM — vai dentro do pacote
   =============================================================================

   Detecta sozinho qual versao o LMS oferece e traduz as chamadas, para o
   player.js nao precisar saber a diferenca:

     SCORM 2004  window.API_1484_11   Initialize / GetValue / SetValue / Terminate
     SCORM 1.2   window.API           LMSInitialize / LMSGetValue / ...

   A busca sobe a cadeia de janelas pai (o LMS costuma abrir o curso num
   iframe ou popup) e tambem tenta o opener. Se nao achar nada, active fica
   false e todas as chamadas viram no-op: o curso roda normalmente fora do
   LMS, apenas sem registrar nada.

   EQUIVALENCIA DOS CAMPOS
     conceito        2004                      1.2
     posicao         cmi.location              cmi.core.lesson_location
     retomada        cmi.suspend_data          cmi.suspend_data
     conclusao       cmi.completion_status     cmi.core.lesson_status
     aprovacao       cmi.success_status        cmi.core.lesson_status
     nota            cmi.score.scaled/raw      cmi.core.score.raw
     progresso       cmi.progress_measure      (nao existe)

   Detalhe do 1.2: como conclusao e aprovacao dividem o mesmo campo,
   setComplete() nao sobrescreve um status passed/failed ja gravado.
   ========================================================================== */
(function (root) {
  "use strict";

  var api = null;      // objeto da API do LMS
  var mode = null;     // "2004" | "1.2"
  var active = false;

  // Procura o objeto da API subindo a cadeia de janelas pai (limite de 500 niveis).
  function findIn(win) {
    var tries = 0;
    while (win && tries < 500) {
      if (win.API_1484_11) return { api: win.API_1484_11, mode: "2004" };
      if (win.API) return { api: win.API, mode: "1.2" };
      if (!win.parent || win.parent === win) break;
      win = win.parent;
      tries++;
    }
    return null;
  }

  // Tenta encontrar a API na janela atual, no opener e no opener do topo.
  function locate() {
    var found = findIn(window);
    if (!found && window.opener) found = findIn(window.opener);
    if (!found && window.top && window.top.opener) found = findIn(window.top.opener);
    return found;
  }

  // GetValue/SetValue traduzido para a versao detectada (2004 ou 1.2).
  function raw(name, value) {
    if (!active) return "";
    try {
      if (arguments.length === 1) {
        return mode === "2004" ? api.GetValue(name) : api.LMSGetValue(name);
      }
      var r = mode === "2004"
        ? api.SetValue(name, String(value))
        : api.LMSSetValue(name, String(value));
      return r;
    } catch (e) {
      return "";
    }
  }

  var S = {
    get active() { return active; },
    get mode() { return mode; },

    init: function () {
      var found = locate();
      if (!found) return false;
      api = found.api;
      mode = found.mode;
      try {
        var ok = mode === "2004" ? api.Initialize("") : api.LMSInitialize("");
        active = String(ok) === "true" || ok === true;
      } catch (e) {
        active = false;
      }
      if (active && mode === "2004") raw("cmi.exit", "suspend");
      if (active && mode === "1.2") {
        // 1.2: se o status vier "not attempted", marcamos como iniciado
        var st = raw("cmi.core.lesson_status");
        if (!st || st === "not attempted" || st === "not_attempted") {
          raw("cmi.core.lesson_status", "incomplete");
        }
      }
      return active;
    },

    learner: function () {
      return active
        ? (mode === "2004" ? raw("cmi.learner_name") : raw("cmi.core.student_name"))
        : "";
    },

    getBookmark: function () {
      return active ? raw(mode === "2004" ? "cmi.location" : "cmi.core.lesson_location") : "";
    },
    setBookmark: function (v) {
      raw(mode === "2004" ? "cmi.location" : "cmi.core.lesson_location", String(v).slice(0, 200));
    },

    getSuspend: function () { return active ? raw("cmi.suspend_data") : ""; },
    setSuspend: function (v) { raw("cmi.suspend_data", String(v)); },

    setProgress: function (frac) {
      if (mode !== "2004") return;
      var f = Math.max(0, Math.min(1, frac));
      raw("cmi.progress_measure", f.toFixed(4));
    },

    /* pct: 0-100 | passed: bool|null */
    setScore: function (pct, passed) {
      var p = Math.max(0, Math.min(100, Math.round(pct)));
      if (mode === "2004") {
        raw("cmi.score.min", "0");
        raw("cmi.score.max", "100");
        raw("cmi.score.raw", p);
        raw("cmi.score.scaled", (p / 100).toFixed(4));
        if (passed !== null) raw("cmi.success_status", passed ? "passed" : "failed");
      } else {
        raw("cmi.core.score.min", "0");
        raw("cmi.core.score.max", "100");
        raw("cmi.core.score.raw", p);
        if (passed !== null) raw("cmi.core.lesson_status", passed ? "passed" : "failed");
      }
    },

    setComplete: function (done) {
      if (mode === "2004") {
        raw("cmi.completion_status", done ? "completed" : "incomplete");
      } else {
        // em 1.2, passed/failed tem prioridade sobre completed
        var st = raw("cmi.core.lesson_status");
        if (st !== "passed" && st !== "failed") {
          raw("cmi.core.lesson_status", done ? "completed" : "incomplete");
        }
      }
    },

    commit: function () {
      if (!active) return;
      try { mode === "2004" ? api.Commit("") : api.LMSCommit(""); } catch (e) {}
    },

    /* exitMode: "suspend" (padrao, permite retomar de onde parou) ou "normal"
       (encerramento deliberado pelo aluno, tentativa fechada). */
    finish: function (exitMode) {
      if (!active) return;
      var ex = exitMode === "normal" ? "normal" : "suspend";
      try {
        if (mode === "2004") { raw("cmi.exit", ex); api.Commit(""); api.Terminate(""); }
        else { raw("cmi.core.exit", ex === "normal" ? "" : "suspend"); api.LMSCommit(""); api.LMSFinish(""); }
      } catch (e) {}
      active = false;
    }
  };

  root.SCORM = S;
})(window);
</script>

<!-- =================================================================
     BIBLIOTECAS DE TERCEIROS (locais, so na ferramenta)
       JSZip   monta e le arquivos .zip
       pdf.js  rasteriza paginas de PDF em imagem

     Ficam em js/vendor/, versionadas junto com o projeto: a Bancada nao faz
     nenhuma requisicao de rede. Procedencia, versoes, sha256 e licencas em
     js/vendor/LEIA-ME.md.

     O terceiro arquivo do pdf.js — pdf.worker.min.js — NAO entra aqui: quem
     o carrega e o proprio pdf.js, sob demanda, na primeira importacao de PDF
     (ver setupPdfWorker em js/importers.js). Assim 1 MB nao e lido a cada
     abertura da ferramenta.

     Nada disso vai para o pacote: o curso exportado nao depende de nada
     externo nem destes arquivos.
     ================================================================= -->
<script src="js/vendor/jszip.min.js"></script>

     CODIGO DA FERRAMENTA

     Scripts classicos, compartilhando o escopo global, na ordem de
     dependencia. Nao sao modulos ES de proposito: type="module" exige
     HTTP e quebraria a ferramenta aberta por duplo clique (file://).

     A ordem importa em um ponto so: state.js declara S no momento em que
     carrega, e todos os outros dependem dele. app.js vem por ultimo porque
     chama init() na hora.
     ================================================================= -->
